services:
  api:
    container_name: SmartRise-Backend-Api
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      - db

  db:
    container_name: SmartRise-Backend-DB
    image: postgres:16
    environment:
      POSTGRES_DB: smartdesk
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./Database/Init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data: